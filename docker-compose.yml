version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: shortlink-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: shortlink
      MYSQL_USER: shortlink
      MYSQL_PASSWORD: shortlinkpass
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password

  redis:
    image: redis:7-alpine
    container_name: shortlink-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

  app:
    build: .
    container_name: shortlink-app
    restart: always
    depends_on:
      - mysql
      - redis
    ports:
      - "8080:8080"
    environment:
      # 服务配置
      SHORTLINK_SERVER_PORT: "8080"
      SHORTLINK_SERVER_BASE_URL: "http://localhost:8080"
      # 数据库配置
      SHORTLINK_DATABASE_DRIVER: "mysql"
      SHORTLINK_DATABASE_DSN: "shortlink:shortlinkpass@tcp(mysql:3306)/shortlink?charset=utf8mb4&parseTime=True&loc=Local"
      # Redis 配置
      SHORTLINK_REDIS_ADDR: "redis:6379"
      SHORTLINK_REDIS_PASSWORD: ""
      SHORTLINK_REDIS_DB: "0"
      SHORTLINK_REDIS_POOL_SIZE: "10"
    # 可选：挂载配置文件（如果不想用环境变量）
    # volumes:
    #   - ./config/config.yaml:/root/config/config.yaml

volumes:
  mysql-data:
  redis-data: